name: Pipeline Cron

on:
  schedule:
    # KST 06:00 = UTC 21:00 (전날)
    - cron: "0 21 * * *"
    # KST 12:00 = UTC 03:00
    - cron: "0 3 * * *"
    # KST 18:00 = UTC 09:00
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      siteIds:
        description: "Comma-separated site IDs (empty = all)"
        required: false
        default: ""
      maxPages:
        description: "Max pages per site"
        required: false
        default: "5"
      limitPerSite:
        description: "Max articles per site"
        required: false
        default: "5"
      dateFrom:
        description: "Date range start (YYYY-MM-DD)"
        required: false
        default: ""
      dateTo:
        description: "Date range end (YYYY-MM-DD)"
        required: false
        default: ""

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
      ALLOW_INSECURE_TLS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run pipeline
        run: |
          ARGS=""
          if [ -n "${{ inputs.siteIds }}" ]; then
            ARGS="$ARGS --sites ${{ inputs.siteIds }}"
          fi
          if [ -n "${{ inputs.maxPages }}" ]; then
            ARGS="$ARGS --max-pages ${{ inputs.maxPages }}"
          fi
          if [ -n "${{ inputs.limitPerSite }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limitPerSite }}"
          fi
          if [ -n "${{ inputs.dateFrom }}" ] && [ -n "${{ inputs.dateTo }}" ]; then
            ARGS="$ARGS --date-from ${{ inputs.dateFrom }} --date-to ${{ inputs.dateTo }}"
          fi
          npx tsx scripts/run-pipeline.ts $ARGS
