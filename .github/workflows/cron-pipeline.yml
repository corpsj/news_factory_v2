name: Pipeline Cron

on:
  schedule:
    # KST 06:00 = UTC 21:00 (전날)
    - cron: "0 21 * * *"
    # KST 12:00 = UTC 03:00
    - cron: "0 3 * * *"
    # KST 18:00 = UTC 09:00
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger crawl pipeline
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/crawl")
          
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          
          echo "Status: $http_code"
          echo "Response: $body"
          
          if [ "$http_code" -ge 400 ]; then
            echo "::error::Pipeline request failed with status $http_code"
            exit 1
          fi
